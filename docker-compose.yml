services:
  api:
    build: .
    image: tradewinds-api
    restart: unless-stopped
    env_file: .env
    environment:
      TRADEWINDS_DATABASE_URL: postgresql+asyncpg://tradewinds:${POSTGRES_PASSWORD:-tradewinds}@postgres:5432/tradewinds
      TRADEWINDS_REDIS_URL: redis://redis:6379/0
      # 演示默认值(优先级高于 .env):邮件投递到 Mailpit 本地收件箱,SPA 由 api 容器托管
      TRADEWINDS_APP_BASE_URL: http://localhost
      TRADEWINDS_SMTP_HOST: mailpit
      TRADEWINDS_SMTP_PORT: "1025"
      TRADEWINDS_SMTP_START_TLS: "false"
      TRADEWINDS_SMTP_FROM: demo@tradewinds.local
      TRADEWINDS_STATIC_DIR: /app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    command: python -m tradewinds.tasks.worker
    restart: unless-stopped
    env_file: .env
    environment:
      TRADEWINDS_DATABASE_URL: postgresql+asyncpg://tradewinds:${POSTGRES_PASSWORD:-tradewinds}@postgres:5432/tradewinds
      TRADEWINDS_REDIS_URL: redis://redis:6379/0
      TRADEWINDS_APP_BASE_URL: http://localhost
      TRADEWINDS_SMTP_HOST: mailpit
      TRADEWINDS_SMTP_PORT: "1025"
      TRADEWINDS_SMTP_START_TLS: "false"
      TRADEWINDS_SMTP_FROM: demo@tradewinds.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: python -m tradewinds.tasks.beat
    restart: unless-stopped
    env_file: .env
    environment:
      TRADEWINDS_DATABASE_URL: postgresql+asyncpg://tradewinds:${POSTGRES_PASSWORD:-tradewinds}@postgres:5432/tradewinds
      TRADEWINDS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradewinds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradewinds}
      POSTGRES_DB: tradewinds
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradewinds -d tradewinds"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "8025:8025"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
