[project]
name = "tradewinds"
version = "0.1.0"
description = "TradeWinds —— 多 Agent 信息研究助理"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradewinds"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# markdown 内代码块不参与格式化,文档改动必须可追溯到文档任务
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle 错误
    "W",     # pycodestyle 警告
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "RUF",   # ruff 专属规则
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/tradewinds --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "integration: 需要真实 PostgreSQL/Redis 的集成测试(CI 起 service 容器运行)",
]
