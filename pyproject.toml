[project]
name = "tradewinds"
version = "0.1.0"
description = "TradeWinds —— 多 Agent 信息研究助理"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "celery>=5.4.0",
    "aiosmtplib>=3.0.0",
    "fastapi>=0.115.0",
    "openai>=1.60.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.0",
    "pyjwt>=2.10.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.0.0",
    "uvicorn[standard]>=0.32.0",
    "sentry-sdk>=2.68.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradewinds"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# markdown 内代码块不参与格式化,文档改动必须可追溯到文档任务
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle 错误
    "W",     # pycodestyle 警告
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "RUF",   # ruff 专属规则
]

[tool.ruff.lint.per-file-ignores]
# FastAPI 惯用法:依赖注入以 Depends() 作为参数默认值
"src/tradewinds/api/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# celery 未发布类型桩;其 @task 装饰器无类型,任务模块放开相关检查
module = ["celery", "celery.*", "tradewinds.tasks.*"]
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/tradewinds --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "integration: 需要真实 PostgreSQL/Redis 的集成测试(CI 起 service 容器运行)",
]
