# 本地钩子走 uv 运行,与 Makefile/CI 使用同一套配置,避免镜像环境漂移
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy (src)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
